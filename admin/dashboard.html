<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — AIVA Enterprises</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23123524'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='18' fill='%23B08D57'>A</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <a href="dashboard.html" class="sidebar-logo">
        <div class="sidebar-logo-icon">A</div>
        AIVA Admin
      </a>
    </div>
    
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link active">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Dashboard
      </a>
      <a href="leads.html" class="sidebar-link">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        Leads & CRM
      </a>
      <a href="analytics.html" class="sidebar-link">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        Analytics
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <a href="../index.html" class="btn btn-outline" style="width: 100%; justify-content: center;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Site
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-header">
      <h1 class="admin-header-title">Overview</h1>
      <div class="admin-header-actions">
        <div style="color: var(--admin-text-muted); font-size: 0.875rem;">Admin User</div>
        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--admin-primary); display: flex; align-items: center; justify-content: center; color: #123524; font-weight: bold;">AD</div>
      </div>
    </header>

    <div class="admin-content">
      
      <!-- KPIs -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          </div>
          <div class="kpi-info">
            <h4>Total Inquiries</h4>
            <div class="kpi-value" id="kpi-total-inquiries">0</div>
          </div>
        </div>
        
        <div class="kpi-card">
          <div class="kpi-icon" style="color: var(--status-new); background: var(--status-new-bg);">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          </div>
          <div class="kpi-info">
            <h4>New Leads</h4>
            <div class="kpi-value" id="kpi-new-leads">0</div>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon" style="color: #8b5cf6; background: rgba(139, 92, 246, 0.1);">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
          </div>
          <div class="kpi-info">
            <h4>Active Products</h4>
            <div class="kpi-value" id="kpi-active-products">0</div>
          </div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
        <!-- Recent Leads Table -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Recent Inquiries</h2>
            <a href="leads.html" class="btn btn-sm btn-outline">View All</a>
          </div>
          <div class="table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Date</th>
                  <th>Contact</th>
                  <th>Country</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="recent-inquiries-body">
                <!-- Data populated by admin.js -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Quick Stats Chart -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Lead Status</h2>
          </div>
          <div class="chart-container">
            <canvas id="analyticsChart"></canvas>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="../js/admin.js"></script>
</body>
</html>
